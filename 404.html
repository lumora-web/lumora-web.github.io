<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Scibly</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F7F5;
    --ink:#12332E;
    --teal:#2E8B7A;
    --coral:#F2734B;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .card{
    max-width:440px;
  }
  .icon-badge{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    background:var(--teal);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.5rem;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:2rem;
    margin:0 0 10px;
  }
  p{
    font-size:1rem;
    color:#3E5C55;
    margin-bottom:24px;
  }
  a.home-btn{
    display:inline-block;
    background:var(--coral);
    color:var(--white);
    text-decoration:none;
    font-weight:700;
    padding:12px 28px;
    border-radius:10px;
    font-family:'Baloo 2',sans-serif;
  }
  a.home-btn:hover{opacity:0.9;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">🔬</div>
    <h1>Oops — page not found!</h1>
    <p>Looks like this experiment didn't quite work out. The page you're looking for doesn't exist, but there's plenty of science waiting for you back home.</p>
    <a class="home-btn" href="/">← Back to Scibly</a>
  </div>
</body>
</html>
